name: Build DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-dmg:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Verify Swift version
        run: swift --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMGs (Apple Silicon & Intel)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build-dmg.sh

      - name: Add stable release asset names
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/CalendarPlus-*-arm64.dmg; do cp "$f" dist/CalendarPlus-arm64.dmg; done
          for f in dist/CalendarPlus-*-x86_64.dmg; do cp "$f" dist/CalendarPlus-x86_64.dmg; done
          ls -1 dist/CalendarPlus-arm64.dmg dist/CalendarPlus-x86_64.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarPlus-${{ steps.version.outputs.value }}-dmg
          path: dist/CalendarPlus-*-*.dmg

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CalendarPlus-arm64.dmg
            dist/CalendarPlus-x86_64.dmg
